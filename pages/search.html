<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Search - Madden 27 Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        dark: { 900: '#0a0a0f', 800: '#12121a', 700: '#1a1a2e', 600: '#252540' },
        neon: { green: '#00ff87', blue: '#60a5fa', purple: '#a78bfa', red: '#f87171', yellow: '#fbbf24', cyan: '#22d3ee' }
      }}}
    }
  </script>
</head>
<body class="bg-dark-900 text-white min-h-screen">
  <nav class="fixed top-0 w-full z-50 bg-dark-800/95 backdrop-blur-md border-b border-dark-600">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="../index.html" class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-br from-neon-green to-neon-blue rounded-lg flex items-center justify-center font-black text-dark-900 text-lg">M</div>
          <span class="text-xl font-bold bg-gradient-to-r from-neon-green to-neon-blue bg-clip-text text-transparent">Madden 27 Lab</span>
        </a>
        <div class="hidden md:flex items-center gap-1">
          <a href="../index.html" class="nav-link"><i class="bi bi-house-fill mr-1"></i> Home</a>
          <a href="coverages.html" class="nav-link"><i class="bi bi-shield-fill mr-1"></i> Coverages</a>
          <a href="offenses.html" class="nav-link"><i class="bi bi-lightning-fill mr-1"></i> Offenses</a>
          <a href="matchups.html" class="nav-link"><i class="bi bi-arrows-angle-expand mr-1"></i> Matchups</a>
          <a href="playbook-select.html" class="nav-link"><i class="bi bi-book-fill mr-1"></i> Playbooks</a>
          <a href="search.html" class="nav-link active"><i class="bi bi-search mr-1"></i> Search</a>
        </div>
        <button id="mobileMenuBtn" class="md:hidden text-2xl text-gray-400 hover:text-white"><i class="bi bi-list"></i></button>
      </div>
    </div>
    <div id="mobileMenu" class="hidden md:hidden bg-dark-800 border-t border-dark-600">
      <div class="px-4 py-3 space-y-2">
        <a href="../index.html" class="block nav-link">Home</a>
        <a href="coverages.html" class="block nav-link">Coverages</a>
        <a href="offenses.html" class="block nav-link">Offenses</a>
        <a href="matchups.html" class="block nav-link">Matchups</a>
        <a href="playbook-select.html" class="block nav-link">Playbooks</a>
        <a href="search.html" class="block nav-link active">Search</a>
      </div>
    </div>
  </nav>

  <main class="pt-24 pb-16 px-4">
    <div class="max-w-7xl mx-auto">
      <div class="mb-8">
        <h1 class="text-3xl md:text-4xl font-black mb-2">
          <i class="bi bi-search text-neon-cyan mr-2"></i>Universal Search
        </h1>
        <p class="text-gray-400">Search every play, coverage, formation, personnel grouping, and playbook. Find anything instantly.</p>
      </div>

      <!-- Search Bar -->
      <div class="relative mb-6">
        <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-xl"></i>
        <input type="text" id="universalSearch" class="search-input text-lg py-4 pl-12" placeholder="Search plays, coverages, formations, personnel, playbooks..." autofocus>
      </div>

      <!-- Filter Row -->
      <div class="flex flex-wrap gap-2 mb-6">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="offense">Offensive Plays</button>
        <button class="filter-btn" data-filter="defense">Defensive Plays</button>
        <button class="filter-btn" data-filter="formation">By Formation</button>
        <button class="filter-btn" data-filter="personnel">By Personnel</button>
        <button class="filter-btn" data-filter="playbook">By Playbook</button>
      </div>

      <!-- Formation / Personnel / Playbook quick filters -->
      <div id="subFilters" class="mb-6 hidden">
        <select id="subFilterSelect" class="custom-select">
          <option value="">Choose a filter...</option>
        </select>
      </div>

      <!-- Results count -->
      <div class="mb-4 text-sm text-gray-500" id="resultCount"></div>

      <!-- Results -->
      <div id="searchResults" class="space-y-3"></div>
    </div>
  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-content" id="detailModalContent"></div>
  </div>

  <script type="module" src="../js/pages/search.js"></script>
</body>
</html>
