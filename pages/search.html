<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Search - Madden 27 Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        dark: { 900: '#0d001a', 800: '#1a0033', 700: '#2a0055', 600: '#2F4F4F' },
        neon: { green: '#00FFFF', blue: '#8A2BE2', purple: '#4B0082', red: '#FF1493', yellow: '#00FFFF', cyan: '#00FFFF' }
      }}}
    }
  </script>
</head>
<body class="bg-dark-900 text-white min-h-screen">
  <nav class="fixed top-0 w-full z-50 bg-dark-800/95 backdrop-blur-md border-b border-dark-600"></nav>
  <script type="module">import { initNav } from '../js/components/nav.js'; initNav();</script>

  <main class="pt-24 pb-16 px-4">
    <div class="max-w-7xl mx-auto">
      <div class="mb-8">
        <h1 class="text-3xl md:text-4xl font-black mb-2">
          <i class="bi bi-search text-neon-cyan mr-2"></i>Universal Search
        </h1>
        <p class="text-gray-400">Search every play, coverage, formation, personnel grouping, and playbook. Find anything instantly.</p>
      </div>

      <!-- Search Bar -->
      <div class="relative mb-6">
        <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-xl"></i>
        <input type="text" id="universalSearch" class="search-input text-lg py-4 pl-12" placeholder="Search plays, coverages, formations, personnel, playbooks..." autofocus>
      </div>

      <!-- Filter Row -->
      <div class="flex flex-wrap gap-2 mb-6">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="offense">Offensive Plays</button>
        <button class="filter-btn" data-filter="defense">Defensive Plays</button>
        <button class="filter-btn" data-filter="formation">By Formation</button>
        <button class="filter-btn" data-filter="personnel">By Personnel</button>
        <button class="filter-btn" data-filter="playbook">By Playbook</button>
      </div>

      <!-- Formation / Personnel / Playbook quick filters -->
      <div id="subFilters" class="mb-6 hidden">
        <select id="subFilterSelect" class="custom-select">
          <option value="">Choose a filter...</option>
        </select>
      </div>

      <!-- Results count -->
      <div class="mb-4 text-sm text-gray-500" id="resultCount"></div>

      <!-- Results -->
      <div id="searchResults" class="space-y-3"></div>
    </div>
  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-content" id="detailModalContent"></div>
  </div>

  <script type="module" src="../js/pages/search.js"></script>
</body>
</html>
