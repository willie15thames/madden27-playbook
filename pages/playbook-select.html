<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playbook Browser - Madden 27 Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        dark: { 900: '#0d001a', 800: '#1a0033', 700: '#2a0055', 600: '#2F4F4F' },
        neon: { green: '#00FFFF', blue: '#8A2BE2', purple: '#4B0082', red: '#FF1493', yellow: '#00FFFF', cyan: '#00FFFF' }
      }}}
    }
  </script>
</head>
<body class="bg-dark-900 text-white min-h-screen">
  <nav class="fixed top-0 w-full z-50 bg-dark-800/95 backdrop-blur-md border-b border-dark-600"></nav>
  <script type="module">import { initNav } from '../js/components/nav.js'; initNav();</script>

  <main class="pt-24 pb-16 px-4">
    <div class="max-w-7xl mx-auto">
      <div class="mb-8">
        <h1 class="text-3xl md:text-4xl font-black mb-2">
          <i class="bi bi-book-fill text-neon-cyan mr-2"></i>Playbook Browser
        </h1>
        <p class="text-gray-400">Browse every playbook — click any play to see what it beats and what stops it.</p>
      </div>

      <!-- Side Selector -->
      <div class="flex gap-3 mb-6">
        <button class="filter-btn active" id="offenseTabBtn" data-side="offense">
          <i class="bi bi-lightning-fill mr-1"></i> Offensive Playbooks
        </button>
        <button class="filter-btn" id="defenseTabBtn" data-side="defense">
          <i class="bi bi-shield-fill mr-1"></i> Defensive Playbooks
        </button>
      </div>

      <!-- Playbook Selector -->
      <div class="flex flex-col md:flex-row gap-4 mb-6">
        <select id="playbookSelector" class="custom-select flex-1">
          <option value="">Choose a playbook...</option>
        </select>
        <div class="relative flex-1">
          <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="text" id="playbookSearch" class="search-input" placeholder="Search plays in this book...">
        </div>
      </div>

      <!-- Playbook Info -->
      <div id="playbookInfo" class="hidden results-panel mb-6">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div>
            <h2 class="text-2xl font-black" id="playbookName"></h2>
            <p class="text-gray-400 text-sm" id="playbookStyle"></p>
          </div>
          <div class="flex gap-6 text-center">
            <div>
              <div class="text-2xl font-black text-[#00FFFF]" id="formationCount">0</div>
              <div class="text-xs text-gray-500">Formations</div>
            </div>
            <div>
              <div class="text-2xl font-black text-[#8A2BE2]" id="setCount">0</div>
              <div class="text-xs text-gray-500">Sets</div>
            </div>
            <div>
              <div class="text-2xl font-black text-[#FF1493]" id="playCount">0</div>
              <div class="text-xs text-gray-500">Plays</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Formation Tree -->
      <div id="formationTree"></div>
    </div>
  </main>

  <!-- Play Detail Modal -->
  <div class="modal-overlay" id="playDetailModal">
    <div class="modal-content" id="playDetailContent"></div>
  </div>

  <script type="module" src="../js/pages/playbook-select.js"></script>
</body>
</html>
