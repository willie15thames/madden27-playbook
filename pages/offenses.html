<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offensive Plays - Madden 27 Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        dark: { 900: '#0d001a', 800: '#1a0033', 700: '#2a0055', 600: '#2F4F4F' },
        neon: { green: '#00FFFF', blue: '#8A2BE2', purple: '#4B0082', red: '#FF1493', yellow: '#00FFFF', cyan: '#00FFFF' }
      }}}
    }
  </script>
</head>
<body class="bg-dark-900 text-white min-h-screen">
  <nav class="fixed top-0 w-full z-50 bg-dark-800/95 backdrop-blur-md border-b border-dark-600"></nav>
  <script type="module">import { initNav } from '../js/components/nav.js'; initNav();</script>

  <main class="pt-24 pb-16 px-4">
    <div class="max-w-7xl mx-auto">
      <div class="mb-8">
        <h1 class="text-3xl md:text-4xl font-black mb-2">
          <i class="bi bi-lightning-fill text-neon-cyan mr-2"></i>Offensive Play Types
        </h1>
        <p class="text-gray-400">Every play type — what coverages it beats and what stops it.</p>
      </div>

      <!-- Search & Filters -->
      <div class="mb-8 flex flex-col md:flex-row gap-4">
        <div class="relative flex-1">
          <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="text" id="playSearch" class="search-input" placeholder="Search plays...">
        </div>
        <div class="flex gap-2 flex-wrap">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="Run">Run</button>
          <button class="filter-btn" data-filter="Pass">Pass</button>
        </div>
      </div>

      <!-- Position Group Filter -->
      <div id="posFilterContainer" class="mb-4"></div>

      <!-- Plays Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="playsGrid"></div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="playModal">
    <div class="modal-content" id="playModalContent"></div>
  </div>

  <script type="module" src="../js/pages/offenses.js"></script>
</body>
</html>
